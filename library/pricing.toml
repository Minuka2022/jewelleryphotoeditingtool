# Models and prices, in US dollars per generated image (paid tier).
# Read from Google's pricing page on the date below. Google changes model names
# and prices often, so check https://ai.google.dev/gemini-api/docs/pricing
# and update this file when they change. Nothing here is hard-coded in the app.

